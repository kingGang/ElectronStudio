<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectronStudio · 小电</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶栏：品牌 / 导航 / 子系统状态灯 / 模型选择 -->
  <header class="topbar">
    <div class="brand">◢ VERDUGO</div>
    <nav class="nav" id="nav">
      <button class="nav-btn active" data-view="home">对话</button>
      <button class="nav-btn" data-view="choreo">动作编排</button>
      <button class="nav-btn" data-view="settings">设置</button>
    </nav>
    <div class="status-dots">
      <span class="dot" id="dot-usb"><i></i>USB</span>
      <span class="dot" id="dot-asr"><i></i>ASR</span>
      <span class="dot" id="dot-tts"><i></i>TTS</span>
    </div>
    <div class="spacer"></div>
    <label class="model-picker">
      <span>模型</span>
      <select id="model-select"></select>
    </label>
    <div class="conn-state" id="conn-state">连接中…</div>
  </header>

  <!-- ===== 视图：对话首页 ===== -->
  <main class="view active layout" data-view="home">
    <section class="robot-pane">
      <div class="robot-face" id="robot-face" data-state="idle">
        <canvas id="mirror" width="240" height="240"></canvas>
        <div class="face-fallback" id="face-fallback">
          <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="voice-state" id="voice-state">
        <span class="vs-dot"></span><span class="vs-text" id="vs-text">待命</span>
      </div>
      <canvas class="waveform" id="waveform" width="220" height="40"></canvas>
      <button class="qa" id="btn-camera" style="display:none">📷 摄像头</button>
      <div class="emotions" id="emotions" aria-label="情绪">
        <button class="chip" data-emotion="happy">😊</button>
        <button class="chip" data-emotion="sad">😢</button>
        <button class="chip" data-emotion="angry">😠</button>
        <button class="chip" data-emotion="surprised">😮</button>
        <button class="chip" data-emotion="neutral">😐</button>
      </div>
    </section>

    <section class="chat-pane">
      <div class="chat-stream" id="chat-stream"></div>
      <div class="quick-actions" id="quick-actions">
        <span class="qa-label">快捷动作</span>
        <button class="qa" data-action="wave">👋 打招呼</button>
        <button class="qa" data-action="nod">🙂 点头</button>
        <button class="qa" data-action="shake">🙅 摇头</button>
        <button class="qa" data-action="home">↩ 归位</button>
        <button class="qa" id="btn-greet">👋 看一眼打招呼</button>
        <button class="qa danger" id="btn-interrupt">⏹ 打断</button>
      </div>
      <div class="music-bar" id="music-bar" style="display:none">
        <span class="music-icon">♪</span>
        <span class="music-now" id="music-now">未播放</span>
        <button class="icon-btn" id="music-pause" title="暂停/继续">⏸</button>
        <button class="icon-btn" id="music-stop" title="停止">⏹</button>
      </div>
      <form class="composer" id="composer">
        <input id="composer-input" type="text" placeholder="输入文字…" autocomplete="off" />
        <button type="button" class="icon-btn" id="btn-mic" title="切换拾音">🎤</button>
        <button type="submit" class="icon-btn primary" title="发送">➤</button>
      </form>
    </section>
  </main>

  <!-- ===== 视图：动作编排 ===== -->
  <main class="view choreo-view" data-view="choreo">
    <section class="panel">
      <h2>动作库</h2>
      <div class="action-list" id="action-list"><span class="muted">等待状态…</span></div>
      <button class="qa danger" id="choreo-stop">⏹ 停止</button>

      <div class="record-box">
        <div class="panel-head">
          <h2>示教录制</h2>
          <label class="enable-toggle"><input type="checkbox" id="follow-toggle" /> 跟随设备（松力可手掰）</label>
        </div>
        <p class="muted">开启“跟随设备”后掰动机器人，左侧滑块会实时跟随真实角度；点“采帧”逐个记录姿态，停止即保存为新动作。</p>
        <div class="am-row">
          <input id="rec-name" placeholder="动作名，如 my_dance" />
          <button class="qa" id="rec-start">● 开始</button>
          <button class="qa" id="rec-frame">📸 采帧</button>
          <button class="qa danger" id="rec-stop">■ 停止保存</button>
        </div>
        <span class="muted" id="rec-status">未在录制</span>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>手动调试（6 轴）</h2>
        <label class="enable-toggle"><input type="checkbox" id="jog-enable" checked /> 舵机使能</label>
      </div>
      <div class="joints" id="joints"></div>
    </section>
  </main>

  <!-- ===== 视图：设置 ===== -->
  <main class="view settings-view" data-view="settings">
    <section class="panel">
      <h2>大模型</h2>
      <div class="model-list" id="model-list"><span class="muted">等待状态…</span></div>
      <form class="add-model" id="add-model">
        <div class="am-row">
          <input id="am-name" placeholder="显示名" />
          <select id="am-type">
            <option value="openai">OpenAI 兼容 / Ollama</option>
            <option value="echo">本地回声(echo)</option>
          </select>
        </div>
        <div class="am-row am-openai">
          <input id="am-base" placeholder="Base URL，如 http://localhost:11434/v1" />
        </div>
        <div class="am-row am-openai">
          <input id="am-model" placeholder="模型名，如 qwen2.5 / gpt-4o" />
          <input id="am-key" type="password" placeholder="API Key（本地可留空）" />
        </div>
        <button type="submit" class="qa">+ 添加模型</button>
      </form>
    </section>
    <section class="panel">
      <h2>语音（本地）</h2>
      <div class="kv"><span>ASR</span><b id="set-asr">—</b></div>
      <div class="kv"><span>TTS</span><b id="set-tts">—</b></div>
      <p class="muted">唤醒词 / VAD 灵敏度在语音 sidecar 内配置，见 docs/SPEECH.md。</p>
    </section>
    <section class="panel">
      <h2>提醒 / 定时任务</h2>
      <div class="model-list" id="schedule-list"><span class="muted">无</span></div>
      <form class="add-model" id="add-schedule">
        <div class="am-row">
          <input id="sch-title" placeholder="标题/提醒内容" />
          <select id="sch-when">
            <option value="after">N 分钟后</option>
            <option value="daily">每日 HH:MM</option>
            <option value="every">每隔（如 1h）</option>
          </select>
          <input id="sch-val" placeholder="10 / 08:00 / 1h" style="max-width:90px" />
        </div>
        <button type="submit" class="qa">+ 添加</button>
      </form>
    </section>
    <section class="panel">
      <h2>机器人</h2>
      <div class="kv"><span>连接</span><b id="set-usb">—</b></div>
      <div class="kv"><span>VID / PID</span><b id="set-vidpid">—</b></div>
      <div class="kv"><span>帧率</span><b id="set-fps">—</b></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
